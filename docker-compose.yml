# =====================================================================
#  Docker Compose - DevOps-Projet-de-fin-de-module
#  Services : db (MySQL 8.4) -> backend + users-microservice -> frontend (Nginx)
#
#  Prerequis : un fichier .env a la racine (copie de .env.example)
#  Developpement (images construites ici, tag "dev") :
#      docker compose up -d --build --wait
#  Mise en service d'une version publiee (image jamais reconstruite) :
#      bash scripts/deploy.sh v1.0.0
#  Acces     : http://localhost:8088  (seul port publie sur la machine)
#
#  Images : ${IMAGE_REGISTRY}/devops-<service>:${IMAGE_TAG}
#           (defaut ghcr.io/tasnime-eljed/devops-<service>:dev)
# =====================================================================

# Nom du projet : prefixe des conteneurs, du reseau et du volume (devops-projet-...)
name: devops-projet

services:

  # ---------------------------------------------------------------
  # Base de donnees MySQL dediee au projet (independante de XAMPP)
  # Aucun port publie : seuls les conteneurs du reseau devops-net y accedent.
  # ---------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant dans .env}
      MYSQL_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER manquant dans .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD manquant dans .env}
      MYSQL_DATABASE: departement_employee
    volumes:
      - mysql_data:/var/lib/mysql
      # Script execute uniquement au premier demarrage (volume vide) :
      # cree users_db et donne les droits au compte applicatif
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 (TCP) : on teste le vrai serveur, pas le serveur temporaire d'initialisation
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - devops-net

  # ---------------------------------------------------------------
  # Backend Spring Boot : employes / departements (port interne 8081)
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: ${IMAGE_REGISTRY:-ghcr.io/tasnime-eljed}/devops-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      # "db" = nom du service MySQL (jamais localhost entre conteneurs)
      DB_URL: jdbc:mysql://db:3306/departement_employee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_APP_USER}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_VERSION: ${IMAGE_TAG:-dev}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}
    depends_on:
      db:
        condition: service_healthy
    # healthcheck : HEALTHCHECK du Dockerfile (GET /departement_employee/health)
    networks:
      - devops-net

  # ---------------------------------------------------------------
  # users-microservice : inscription, login JWT, verification email (port interne 8082)
  # ---------------------------------------------------------------
  users-microservice:
    build:
      context: ./users-microservice
    image: ${IMAGE_REGISTRY:-ghcr.io/tasnime-eljed}/devops-users-microservice:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_APP_USER}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_VERSION: ${IMAGE_TAG:-dev}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Cree les roles ADMIN/USER et le compte admin s'ils n'existent pas
      ADMIN_INIT_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    # healthcheck : HEALTHCHECK du Dockerfile (GET /users/health)
    networks:
      - devops-net

  # ---------------------------------------------------------------
  # Frontend Angular servi par Nginx + reverse proxy des API
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    image: ${IMAGE_REGISTRY:-ghcr.io/tasnime-eljed}/devops-frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      # 127.0.0.1 : application accessible uniquement depuis ce PC (pas depuis le reseau local)
      - "127.0.0.1:${FRONTEND_PORT:-8088}:8088"
    depends_on:
      backend:
        condition: service_healthy
      users-microservice:
        condition: service_healthy
    # healthcheck : HEALTHCHECK du Dockerfile (GET /health)
    networks:
      - devops-net

  # ---------------------------------------------------------------
  # phpMyAdmin (OPTIONNEL) : consulter la base MySQL Docker dans le navigateur
  # Ne démarre PAS avec "docker compose up" : profil "outils"
  #   docker compose --profile outils up -d phpmyadmin   ->  http://localhost:8090
  # Connexion avec MYSQL_APP_USER / MYSQL_APP_PASSWORD du fichier .env
  # ---------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ["outils"]
    restart: "no"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      # 127.0.0.1 : accessible uniquement depuis ce PC
      - "127.0.0.1:8090:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  # Donnees MySQL persistantes (conservees apres "docker compose down",
  # supprimees uniquement par "docker compose down -v")
  mysql_data:
