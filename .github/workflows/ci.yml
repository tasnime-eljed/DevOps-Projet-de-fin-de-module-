# =====================================================================
#  CI du monorepo (merge request = pull request GitHub)
#   1. tests Maven (backend, users-microservice) sur Java 17 ET 21 (matrice)
#   2. build + tests Angular
#   3. (needs 1 et 2) construction des 3 images Docker, tests de bout en bout
#      avec Docker Compose, persistance MySQL
#   4. sur main uniquement : publication des images TESTEES sur ghcr.io
#      avec le tag sha-<commit>. Le workflow release.yml leur ajoutera
#      ensuite le tag vX.Y.Z SANS les reconstruire.
#  Rapports de tests : publies en artefacts a chaque execution.
# =====================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permissions minimales par defaut : lecture du code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/tasnime-eljed

jobs:

  # ------------------------------------------------------------------
  # Tests Maven : 2 modules x 2 versions de Java (matrice)
  # ------------------------------------------------------------------
  java:
    name: Maven - ${{ matrix.module }} - Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ backend, users-microservice ]
        java: [ '17', '21' ]
        include:
          - module: backend
            database: departement_employee_test
          - module: users-microservice
            database: users_db_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-root --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3307/${{ matrix.database }}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-test-root
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - name: Java ${{ matrix.java }} (Temurin) + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Compilation + tests (mvn verify)
        run: mvn -B verify

      - name: Rapport de tests (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.module }}-java${{ matrix.java }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Frontend Angular : installation, build de production, tests Karma
  # ------------------------------------------------------------------
  frontend:
    name: Angular - build et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 24 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build de production
        run: npm run build

      # Ubuntu 24.04 restreint les "user namespaces" utilises par le bac a sable de Chrome
      - name: Autoriser Chrome Headless
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Tests unitaires (Chrome Headless) + couverture
        run: npm run test:ci -- --code-coverage

      - name: Rapport de tests et couverture (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-frontend-couverture
          path: frontend/coverage/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Images Docker (apres les tests) + tests de bout en bout + publication
  # ------------------------------------------------------------------
  docker:
    name: Docker - images, tests de bout en bout, publication
    runs-on: ubuntu-latest
    needs: [ java, frontend ]
    permissions:
      contents: read
      packages: write      # publication sur ghcr.io (uniquement sur main)
    env:
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Creer un .env de CI (valeurs aleatoires, jamais affichees)
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_APP_USER=app_user"
            echo "MYSQL_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "MAIL_USERNAME="
            echo "MAIL_PASSWORD="
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_EMAIL=admin@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > .env

      - name: Valider docker-compose.yml
        run: docker compose config --quiet

      - name: Construire les 3 images (tag sha-<commit>)
        run: docker compose build

      - name: Demarrer la pile et attendre les HEALTHCHECK
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Etat des conteneurs
        run: docker compose ps

      - name: Tests de bout en bout (sante, securite, login JWT)
        run: |
          set -a; . ./.env; set +a
          EXPECTED_VERSION="$IMAGE_TAG" bash scripts/smoke-test.sh

      - name: Persistance MySQL (redemarrage sans supprimer le volume)
        run: |
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 300
          set -a; . ./.env; set +a
          EXPECTED_VERSION="$IMAGE_TAG" bash scripts/smoke-test.sh

      - name: Logs des conteneurs (artefact, en cas d'echec)
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-docker-compose
          path: compose-logs.txt

      # ---- Publication : seulement apres fusion sur main (jamais depuis une PR) ----
      - name: Connexion a ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les images testees (tag sha-<commit>)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose push backend users-microservice frontend

      - name: Nettoyage (environnement CI jetable)
        if: always()
        run: docker compose down
