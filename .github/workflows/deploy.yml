# =====================================================================
#  Mise en service dans l'environnement de test (+ retour arriere optionnel)
#   - appele automatiquement par release.yml apres un tag vX.Y.Z
#   - lancable a la main (onglet Actions > Deploy > Run workflow) :
#       version   = version a mettre en service (ex. v1.1.0)
#       rollback  = version precedente (ex. v1.0.0) -> retour arriere demontre
#  Les images sont TELECHARGEES depuis ghcr.io, jamais reconstruites.
# =====================================================================
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: Version a mettre en service (vX.Y.Z)
        required: true
        type: string
      rollback:
        description: Version de retour arriere (vide = pas de retour arriere)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version a mettre en service (vX.Y.Z)
        required: true
        type: string
      rollback:
        description: Puis retour arriere vers cette version (vide = non)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Environnement de test - ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: test
    env:
      IMAGE_REGISTRY: ghcr.io/tasnime-eljed
    steps:
      # Scripts et docker-compose.yml de la version deployee
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Connexion a ghcr.io (lecture)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: .env de l'environnement de test (valeurs aleatoires, jamais affichees)
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "MYSQL_APP_USER=app_user"
            echo "MYSQL_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > .env

      - name: Mise en service de ${{ inputs.version }} + controle de sante
        run: bash scripts/deploy.sh "${{ inputs.version }}"

      - name: Controle complet (login JWT, API)
        run: |
          set -a; . ./.env; set +a
          EXPECTED_VERSION="${{ inputs.version }}" bash scripts/smoke-test.sh

      - name: Retour arriere vers ${{ inputs.rollback }} + controle de sante
        if: inputs.rollback != ''
        run: |
          bash scripts/rollback.sh "${{ inputs.rollback }}"
          echo "Version en service apres retour arriere :"
          curl -s http://localhost:8088/departement_employee/health; echo

      - name: Logs (en cas d'echec)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Nettoyage
        if: always()
        run: docker compose down
