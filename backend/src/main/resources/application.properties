spring.application.name=departement_employee
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/departement_employee?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8081
server.servlet.context-path=/departement_employee

# --- Sécurité JWT ---
# Pas de valeur par défaut : l'application refuse de démarrer si JWT_SECRET n'est pas fourni.
# Le backend et users-microservice doivent utiliser EXACTEMENT la même valeur.
jwt.secret=${JWT_SECRET}

# --- CORS ---
# Origines autorisées (séparées par des virgules). Par défaut : le serveur de dev Angular (ng serve).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Fichier .env local (optionnel) ---
# En développement hors Docker, lit les variables du fichier .env situé à la racine du monorepo.
# Dans un conteneur ce fichier n'existe pas : la ligne est alors simplement ignorée.
spring.config.import=optional:file:../.env[.properties]
