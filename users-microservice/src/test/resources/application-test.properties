# =====================================================================
#  Profil "test" (@ActiveProfiles("test")) - base de donnees ISOLEE
#  Par defaut : MySQL jetable sur le port 3307 (conteneur de test), base users_db_test.
#  Le port 3306 (MySQL XAMPP / donnees reelles) n'est JAMAIS utilise par defaut.
#  En CI les valeurs sont fournies par TEST_DB_URL / TEST_DB_USER / TEST_DB_PASSWORD.
# =====================================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/users_db_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:testroot}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cle JWT utilisee uniquement par les tests
jwt.secret=${JWT_SECRET:test-only-secret-never-used-in-production-0123456789}

# Aucun email reel n'est envoye pendant les tests
spring.mail.username=test@example.com
spring.mail.password=

# DataInitializer active avec un compte administrateur de TEST (base de test uniquement)
app.init.enabled=true
app.admin.username=admin-test
app.admin.password=admin-test-password
app.admin.email=admin-test@example.com
