# =====================================================================
#  Profil "test" (@ActiveProfiles("test")) - base de donnees ISOLEE
#  Par defaut : MySQL jetable sur le port 3307 (conteneur de test), base departement_employee_test.
#  Le port 3306 (MySQL XAMPP / donnees reelles) n'est JAMAIS utilise par defaut :
#  sans MySQL de test, les tests echouent au lieu de toucher des donnees reelles.
#  En CI (GitHub Actions) les valeurs sont fournies par TEST_DB_URL / TEST_DB_USER / TEST_DB_PASSWORD.
# =====================================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/departement_employee_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:testroot}

# Schema recree a chaque lancement des tests puis supprime
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cle JWT utilisee uniquement par les tests (jamais en production)
jwt.secret=${JWT_SECRET:test-only-secret-never-used-in-production-0123456789}
