spring.application.name=users-microservice

# Base de données MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Serveur
server.servlet.context-path=/users
server.port=8082

# Autorise les références circulaires entre beans
spring.main.allow-circular-references=true

# Envoi d'emails (Gmail)
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Délais maximum (ms) : sans eux, une connexion SMTP bloquée fait attendre la requête indéfiniment
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Sécurité JWT ---
# Pas de valeur par défaut : l'application refuse de démarrer si JWT_SECRET n'est pas fourni.
# Le backend et users-microservice doivent utiliser EXACTEMENT la même valeur.
jwt.secret=${JWT_SECRET}

# --- CORS ---
# Origines autorisées (séparées par des virgules). Par défaut : le serveur de dev Angular (ng serve).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Fichier .env local (optionnel) ---
# En développement hors Docker, lit les variables du fichier .env situé à la racine du monorepo.
# Dans un conteneur ce fichier n'existe pas : la ligne est alors simplement ignorée.
spring.config.import=optional:file:../.env[.properties]

# --- Initialisation des rôles ADMIN/USER et du compte administrateur ---
# Désactivée par défaut : aucune écriture dans une base locale existante.
# Docker Compose l'active avec ADMIN_INIT_ENABLED=true.
app.init.enabled=${ADMIN_INIT_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
