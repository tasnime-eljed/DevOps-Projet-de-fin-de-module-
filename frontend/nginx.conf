# Configuration Nginx du frontend (conteneur "frontend")
# - sert l'application Angular compilee
# - redirige les appels API vers les conteneurs Spring Boot (reverse proxy)
server {
    listen 8088;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Resolveur DNS interne de Docker : les noms "backend" et "users-microservice"
    # sont resolus au moment de la requete. Nginx demarre donc meme si un service
    # Spring Boot n'est pas encore pret (il repond alors 502 temporairement).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En-tetes transmis aux applications Spring Boot.
    # Host contient "localhost:8088" : Spring voit la meme origine que le navigateur,
    # les appels ne sont donc pas des requetes CORS.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Route de santé du frontend (HEALTHCHECK Docker, CI, déploiement)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"service":"frontend","status":"UP"}';
    }

    # API backend : /departement_employee/... -> http://backend:8081/departement_employee/...
    location /departement_employee/ {
        set $backend_upstream http://backend:8081;
        proxy_pass $backend_upstream;
    }

    # API users-microservice : /users/... -> http://users-microservice:8082/users/...
    location /users/ {
        set $users_upstream http://users-microservice:8082;
        proxy_pass $users_upstream;
    }

    # Fichiers generes par Angular (noms avec empreinte) : cache
    location ~* \.(?:js|css|woff2?|ttf|ico|png|jpg|jpeg|gif|svg)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Routage Angular cote client : toute route inconnue renvoie index.html
    # (ex. /employees ou /login recharges dans le navigateur)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
